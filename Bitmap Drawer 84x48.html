<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Pixel Art Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base styles */
        body { font-family: 'Inter', sans-serif; }
        .editor-container { max-width: 1200px; }

        /* Canvas styles */
        #gridCanvas {
            border: 2px solid #374151;
            background-color: #f3f4f6;
            touch-action: none;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            width: 100%;
            height: auto;
        }

        /* Tool active state */
        .tool-btn.active {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
            background-color: #3b82f6;
            color: white;
        }

        /* Layer item focus/active */
        .layer-item.active {
            background-color: #e0f2fe; 
            border-left: 4px solid #3b82f6;
        }
        .layer-item:hover {
            background-color: #f3f4f6;
        }

        /* Output text */
        .pixel-output {
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Modal specific styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 flex justify-center">

    <div class="editor-container w-full">
        <h1 class="text-3xl font-extrabold text-gray-800 mb-6">Pixel Art Studio</h1>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Panel: Tools and Config -->
            <div class="lg:col-span-3 space-y-6">
                
                <!-- Tools -->
                <div class="bg-white p-4 rounded-xl shadow-lg">
                    <h2 class="text-xl font-semibold mb-3 text-gray-700">Tools</h2>
                    <div id="toolPanel" class="grid grid-cols-4 gap-2">
                        <!-- Tools injected here -->
                    </div>
                </div>

                <!-- Color & Resolution -->
                <div class="bg-white p-4 rounded-xl shadow-lg">
                    <h2 class="text-xl font-semibold mb-3 text-gray-700">Config</h2>
                    <div class="mb-4">
                        <label for="iconWidth" class="block text-sm font-medium text-gray-700">Width (X)</label>
                        <input type="number" id="iconWidth" value="16" min="1" max="84" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border">
                    </div>
                    <div class="mb-4">
                        <label for="iconHeight" class="block text-sm font-medium text-gray-700">Height (Y)</label>
                        <input type="number" id="iconHeight" value="16" min="1" max="48" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border">
                        <p class="text-xs text-gray-500 mt-1">Export is Row-Major (Y, Bank, Bit).</p>
                    </div>
                    <button id="applyResBtn" class="w-full px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition-colors">
                        Apply Resolution
                    </button>
                </div>
            </div>

            <!-- Center Panel: Canvas -->
            <div class="lg:col-span-6 bg-white p-6 rounded-xl shadow-lg flex flex-col items-center">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">
                    Canvas (<span id="dimsText">16x16</span>)
                </h2>
                <div class="max-w-full overflow-hidden">
                    <canvas id="gridCanvas" width="512" height="512"></canvas>
                </div>
                
                <div class="mt-4 flex space-x-4">
                    <button id="clearBtn" class="px-4 py-2 bg-red-500 text-white font-semibold rounded-lg shadow-md hover:bg-red-600 transition-colors">
                        Clear Active Layer
                    </button>
                    <button id="importBtn" class="px-4 py-2 bg-purple-500 text-white font-semibold rounded-lg shadow-md hover:bg-purple-600 transition-colors">
                        Paste & Import C Array
                    </button>
                </div>
            </div>

            <!-- Right Panel: Layers and Export -->
            <div class="lg:col-span-3 space-y-6">
                
                <!-- Layers -->
                <div class="bg-white p-4 rounded-xl shadow-lg">
                    <h2 class="text-xl font-semibold mb-3 text-gray-700">Layers (Active: <span id="activeLayerName">Base Layer</span>)</h2>
                    <div id="layerList" class="space-y-1 max-h-60 overflow-y-auto mb-4">
                        <!-- Layers injected here -->
                    </div>
                    <button id="newLayerBtn" class="w-full px-4 py-2 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 transition-colors">
                        + New Layer
                    </button>
                </div>

                <!-- Export -->
                <div class="bg-gray-800 p-4 rounded-xl shadow-lg text-white">
                    <h2 class="text-xl font-semibold mb-3">C Array Export (Row-Major)</h2>
                    <p class="text-xs text-gray-400 mb-2">
                        Size: <span id="byteCount">0</span> bytes.
                    </p>
                    <button id="copyButton" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-3 rounded-lg transition duration-150 mb-3 text-sm">
                        Copy C Array to Clipboard
                    </button>
                    <div id="byteOutput" class="pixel-output text-yellow-400 text-xs h-32 overflow-y-auto p-2 bg-black rounded-md">
                        Generated code will appear here.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div id="importModal" class="modal-overlay hidden">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Import C Array Data</h2>
            
            <textarea id="arrayInput" class="w-full h-32 p-3 border border-gray-300 rounded-lg font-mono text-sm resize-none focus:ring-blue-500 focus:border-blue-500" placeholder="Paste your const uint8_t array here..."></textarea>
            
            <div class="flex items-center justify-between mt-3 mb-4">
                <button id="previewArrayBtn" class="px-4 py-2 bg-orange-500 text-white font-semibold rounded-lg shadow-md hover:bg-orange-600 transition-colors">
                    Preview Array
                </button>
                <div class="text-sm text-gray-600">
                    <span id="previewDims">W: ? H: ?</span> | <span id="previewBytes">Bytes: ?</span>
                </div>
            </div>

            <div class="text-center mb-4 p-2 border border-dashed border-gray-300 rounded-lg">
                <h3 class="text-lg font-medium mb-2">Preview</h3>
                <canvas id="previewCanvas" width="128" height="128" class="border border-gray-400 mx-auto" style="image-rendering: pixelated;"></canvas>
                <p id="previewError" class="text-red-500 mt-2 text-sm hidden">Error during parsing.</p>
            </div>

            <div class="flex justify-end space-x-3">
                <button id="cancelImportBtn" class="px-4 py-2 bg-gray-300 text-gray-800 font-semibold rounded-lg hover:bg-gray-400 transition-colors">
                    Cancel
                </button>
                <button id="commitImportBtn" disabled class="px-4 py-2 bg-green-500 text-white font-semibold rounded-lg shadow-md opacity-50 cursor-not-allowed transition-colors">
                    Import to Active Layer
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration & State ---
        const MAX_CANVAS_WIDTH = 512; 
        let iconWidth = 16;
        let iconHeight = 16;
        let pixelSize = MAX_CANVAS_WIDTH / iconWidth; 
        
        let layers = [];
        let activeLayerIndex = 0;
        let currentTool = 'pencil';
        
        let isDrawing = false; 
        let drawingState = 1; 
        
        let startX = -1, startY = -1; 
        let previewPixels = null; 
        let layerSnapshot = null; 
        let parsedGrid = null;
        
        // Tool definitions
        const TOOLS = [
            { id: 'pencil', name: 'Pencil', icon: '✎', cursor: 'crosshair' },
            { id: 'eraser', name: 'Eraser', icon: '🧼', cursor: 'cell' },
            { id: 'line', name: 'Line', icon: '╱', cursor: 'crosshair' },
            { id: 'rectangle', name: 'Rectangle', icon: '☐', cursor: 'crosshair' },
            { id: 'circle', name: 'Circle', icon: '○', cursor: 'crosshair' },
            { id: 'move', name: 'Move', icon: '🢀🢂', cursor: 'move' },
            { id: 'fill', name: 'Fill Bucket', icon: '🎨', cursor: 'grab' },
        ];

        // --- DOM Elements ---
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        const byteOutputDiv = document.getElementById('byteOutput');
        const dimsText = document.getElementById('dimsText');
        const byteCountSpan = document.getElementById('byteCount');
        const copyButton = document.getElementById('copyButton');
        const inputWidth = document.getElementById('iconWidth');
        const inputHeight = document.getElementById('iconHeight');
        const layerListDiv = document.getElementById('layerList');
        const toolPanelDiv = document.getElementById('toolPanel');
        const activeLayerNameSpan = document.getElementById('activeLayerName');

        // Modal Elements
        const importModal = document.getElementById('importModal');
        const arrayInput = document.getElementById('arrayInput');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');
        const previewArrayBtn = document.getElementById('previewArrayBtn');
        const commitImportBtn = document.getElementById('commitImportBtn');
        const cancelImportBtn = document.getElementById('cancelImportBtn');
        const previewDimsSpan = document.getElementById('previewDims');
        const previewBytesSpan = document.getElementById('previewBytes');
        const previewErrorP = document.getElementById('previewError');
        const mainImportBtn = document.getElementById('importBtn');

        // --- Utility Functions ---

        /**
         * @brief Creates a blank 2D pixel array.
         */
        function createBlankGrid(w, h) {
            return Array.from({ length: h }, () => Array(w).fill(0));
        }

        /**
         * @brief Gets pixel coordinates from mouse/touch event.
         */
        function getPixelCoords(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const x = Math.floor(((clientX - rect.left) / rect.width) * iconWidth);
            const y = Math.floor(((clientY - rect.top) / rect.height) * iconHeight);
            return { x, y };
        }

        /**
         * @brief Draws a single pixel on the active layer or a temporary grid.
         */
        function setPixel(grid, x, y, value) {
            if (x >= 0 && x < iconWidth && y >= 0 && y < iconHeight) {
                grid[y][x] = value;
            }
        }
        
        // --- Drawing Algorithms ---

        /**
         * @brief Draws a line between two points (Bresenham's Line Algorithm).
         */
        function drawLine(grid, x0, y0, x1, y1, value) {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1;
            const sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;

            while (true) {
                setPixel(grid, x0, y0, value);
                if ((x0 === x1) && (y0 === y1)) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx) { err += dx; y0 += sy; }
            }
        }

        /**
         * @brief Draws a filled rectangle between two points.
         */
        function drawRectangle(grid, x0, y0, x1, y1, value) {
            const minX = Math.min(x0, x1);
            const maxX = Math.max(x0, x1);
            const minY = Math.min(y0, y1);
            const maxY = Math.max(y0, y1);

            for (let y = minY; y <= maxY; y++) {
                for (let x = minX; x <= maxX; x++) {
                    setPixel(grid, x, y, value);
                }
            }
        }

        /**
         * @brief Draws a filled circle (Midpoint Circle Algorithm adaptation).
         */
        function drawCircle(grid, x0, y0, x1, y1, value) {
            const dx = x1 - x0;
            const dy = y1 - y0;
            const radius = Math.round(Math.sqrt(dx * dx + dy * dy));

            let x = radius;
            let y = 0;
            let err = 0;

            while (x >= y) {
                // Draw horizontal line segments to fill the circle
                for (let i = x0 - x; i <= x0 + x; i++) {
                    setPixel(grid, i, y0 + y, value);
                    setPixel(grid, i, y0 - y, value);
                }
                for (let i = x0 - y; i <= x0 + y; i++) {
                    setPixel(grid, i, y0 + x, value);
                    setPixel(grid, i, y0 - x, value);
                }

                if (err <= 0) {
                    y += 1;
                    err += 2 * y + 1;
                }
                if (err > 0) {
                    x -= 1;
                    err -= 2 * x + 1;
                }
            }
        }

        /**
         * @brief Flood fill implementation (Queue-based approach).
         */
        function floodFill(x, y) {
            const targetGrid = layers[activeLayerIndex].data;
            const targetValue = targetGrid[y][x];
            const newValue = drawingState; 

            if (targetValue === newValue) return;

            const queue = [[x, y]];
            
            while(queue.length > 0) {
                const [cx, cy] = queue.shift();

                if (cx >= 0 && cx < iconWidth && cy >= 0 && cy < iconHeight && 
                    targetGrid[cy][cx] === targetValue) {
                    
                    targetGrid[cy][cx] = newValue;
                    
                    queue.push([cx + 1, cy]);
                    queue.push([cx - 1, cy]);
                    queue.push([cx, cy + 1]);
                    queue.push([cx, cy - 1]);
                }
            }
        }

        /**
         * @brief Shifts content of a grid by given offsets.
         */
        function shiftGrid(sourceGrid, offsetX, offsetY) {
            const targetGrid = createBlankGrid(iconWidth, iconHeight);
            for (let y = 0; y < iconHeight; y++) {
                for (let x = 0; x < iconWidth; x++) {
                    const newX = x + offsetX;
                    const newY = y + offsetY;
                    
                    if (newX >= 0 && newX < iconWidth && newY >= 0 && newY < iconHeight) {
                        targetGrid[newY][newX] = sourceGrid[y][x];
                    }
                }
            }
            return targetGrid;
        }

        // --- Canvas Drawing and Rendering ---

        /**
         * @brief Renders the entire scene (composite of visible layers + preview).
         */
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e5e7eb'; // Grid line color (light gray)

            // 1. Render all layers
            for (let k = 0; k < layers.length; k++) {
                const layer = layers[k];
                if (!layer.visible) continue;

                for (let y = 0; y < iconHeight; y++) {
                    for (let x = 0; x < iconWidth; x++) {
                        const is_set = layer.data[y][x];
                        
                        if (is_set) {
                            // Darker color for active layer, lighter for background
                            ctx.fillStyle = (k === activeLayerIndex) ? '#000000' : '#4b5563'; 
                            ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                        }
                    }
                }
            }
            
            // 2. Render Preview Pixels (on top of everything)
            if (previewPixels) {
                for (let y = 0; y < iconHeight; y++) {
                    for (let x = 0; x < iconWidth; x++) {
                        if (previewPixels[y][x]) {
                            ctx.fillStyle = '#f59e0b'; // Amber for preview
                            ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                        }
                    }
                }
            }
            
            // 3. Render Grid Lines (always on top)
            for (let y = 0; y <= iconHeight; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * pixelSize);
                ctx.lineTo(canvas.width, y * pixelSize);
                ctx.stroke();
            }
            for (let x = 0; x <= iconWidth; x++) {
                ctx.beginPath();
                ctx.moveTo(x * pixelSize, 0);
                ctx.lineTo(x * pixelSize, canvas.height);
                ctx.stroke();
            }
        }

        // --- Layer Management ---

        /**
         * @brief Creates a new layer and updates the list.
         */
        function createNewLayer(name = `Layer ${layers.length + 1}`, setActive = true) {
            const newLayer = {
                name: name,
                data: createBlankGrid(iconWidth, iconHeight),
                visible: true,
            };
            layers.push(newLayer);
            if (setActive) {
                activeLayerIndex = layers.length - 1;
            }
            renderLayerList();
            updateUI();
        }

        /**
         * @brief Renders the layer list UI elements.
         */
        function renderLayerList() {
            layerListDiv.innerHTML = '';
            
            if (layers.length === 0) {
                layerListDiv.innerHTML = '<p class="text-gray-500 text-sm p-2">No layers. Click "New Layer" to start.</p>';
                activeLayerNameSpan.textContent = 'None';
                return;
            }
            
            // Render layers in reverse (top layer first)
            layers.slice().reverse().forEach((layer, originalIndex) => {
                const index = layers.length - 1 - originalIndex;
                
                const item = document.createElement('div');
                item.className = `layer-item flex items-center justify-between p-2 rounded-lg cursor-pointer transition duration-100 ${index === activeLayerIndex ? 'active' : ''}`;

                item.innerHTML = `
                    <div class="flex items-center space-x-2 w-full">
                        <button class="toggle-visibility p-1 text-sm rounded-md hover:bg-gray-300" data-index="${index}" title="Toggle Visibility">
                            ${layer.visible ? '👁️' : '🚫'}
                        </button>
                        <span class="layer-name flex-1 text-sm font-medium truncate" data-index="${index}">
                            ${layer.name} ${index === activeLayerIndex ? '(Active)' : ''}
                        </span>
                        <button class="edit-name p-1 text-sm rounded-md hover:bg-gray-300" data-index="${index}" title="Edit Name">
                            ✏️
                        </button>
                    </div>
                    <button class="delete-layer ml-2 p-1 text-sm text-red-500 rounded-md hover:bg-red-100" data-index="${index}" title="Delete Layer">
                        ❌
                    </button>
                `;

                // Event Listeners for Layer Item
                item.addEventListener('click', () => setActiveLayer(index));
                item.querySelector('.toggle-visibility').addEventListener('click', (e) => {
                    e.stopPropagation();
                    layers[index].visible = !layers[index].visible;
                    renderLayerList();
                    updateUI();
                });
                item.querySelector('.delete-layer').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (layers.length > 1) {
                        layers.splice(index, 1);
                        if (activeLayerIndex >= index && activeLayerIndex > 0) {
                            activeLayerIndex--;
                        }
                        renderLayerList();
                        updateUI();
                    }
                });
                item.querySelector('.edit-name').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newName = prompt(`Enter new name for Layer ${index + 1}:`, layer.name);
                    if (newName && newName.trim() !== '') {
                        layers[index].name = newName.trim();
                        renderLayerList();
                    }
                });
                
                layerListDiv.appendChild(item);
            });
            
            if (layers.length > 0) {
                activeLayerNameSpan.textContent = layers[activeLayerIndex].name;
            }
        }
        
        /**
         * @brief Sets the given index as the active layer.
         */
        function setActiveLayer(index) {
            activeLayerIndex = index;
            renderLayerList();
        }

        // --- Drawing Tool Logic ---
        
        const SHAPE_TOOLS = ['line', 'rectangle', 'circle'];
        const SIMPLE_TOOLS = ['pencil', 'eraser', 'fill'];

        /**
         * @brief Commits the currently drawn preview (shape or move) to the active layer's data.
         */
        function commitPreview(finalX, finalY) {
            if (!previewPixels) return;

            const targetGrid = layers[activeLayerIndex].data;
            
            if (SHAPE_TOOLS.includes(currentTool)) {
                // For shapes, we redraw the final shape directly onto the layer data
                previewPixels = createBlankGrid(iconWidth, iconHeight); 
                const value = 1; 
                if (currentTool === 'line') {
                    drawLine(targetGrid, startX, startY, finalX, finalY, value);
                } else if (currentTool === 'rectangle') {
                    drawRectangle(targetGrid, startX, startY, finalX, finalY, value);
                } else if (currentTool === 'circle') {
                    drawCircle(targetGrid, startX, startY, finalX, finalY, value);
                }
            } else if (currentTool === 'move') {
                // For move, the preview IS the final layer data
                const offsetX = finalX - startX;
                const offsetY = finalY - startY;
                layers[activeLayerIndex].data = shiftGrid(layerSnapshot, offsetX, offsetY);
                layerSnapshot = null;
            }

            previewPixels = null; 
        }

        /**
         * @brief Handles the start of a mouse/touch interaction (mousedown/touchstart).
         */
        function handleStart(e) {
            e.preventDefault();
            if (layers.length === 0) return;

            isDrawing = true;
            const { x, y } = getPixelCoords(e);
            startX = x;
            startY = y;
            drawingState = (currentTool === 'eraser' ? 0 : 1); 

            if (SIMPLE_TOOLS.includes(currentTool)) {
                if (currentTool === 'fill') {
                    floodFill(x, y);
                    isDrawing = false; // Fill is a single click action
                } else {
                    setPixel(layers[activeLayerIndex].data, x, y, drawingState);
                }
            } else if (currentTool === 'move') {
                // Snapshot the layer data before moving
                layerSnapshot = JSON.parse(JSON.stringify(layers[activeLayerIndex].data));
                layers[activeLayerIndex].data = createBlankGrid(iconWidth, iconHeight); 
            } else if (SHAPE_TOOLS.includes(currentTool)) {
                // Start tracking for shape preview
                previewPixels = createBlankGrid(iconWidth, iconHeight);
            }
            
            updateUI();
        }

        /**
         * @brief Handles movement during a mouse/touch interaction (mousemove/touchmove).
         */
        function handleMove(e) {
            e.preventDefault();
            if (!isDrawing || layers.length === 0) return;
            
            const { x, y } = getPixelCoords(e);

            if (currentTool === 'pencil' || currentTool === 'eraser') {
                // Draw a line segment for smooth drawing
                drawLine(layers[activeLayerIndex].data, startX, startY, x, y, drawingState);
                startX = x; // Update start point for the next segment
                startY = y;
            } else if (SHAPE_TOOLS.includes(currentTool)) {
                // Redraw shape preview
                previewPixels = createBlankGrid(iconWidth, iconHeight); 
                const value = 1;
                if (currentTool === 'line') {
                    drawLine(previewPixels, startX, startY, x, y, value);
                } else if (currentTool === 'rectangle') {
                    drawRectangle(previewPixels, startX, startY, x, y, value);
                } else if (currentTool === 'circle') {
                    drawCircle(previewPixels, startX, startY, x, y, value);
                }
            } else if (currentTool === 'move') {
                // Update move preview
                const offsetX = x - startX;
                const offsetY = y - startY;
                previewPixels = shiftGrid(layerSnapshot, offsetX, offsetY);
            }
            
            updateUI();
        }

        /**
         * @brief Handles the end of a mouse/touch interaction (mouseup/touchend).
         */
        function handleEnd(e) {
            if (!isDrawing || layers.length === 0) return;
            isDrawing = false;
            
            const { x, y } = getPixelCoords(e);
            
            if (SHAPE_TOOLS.includes(currentTool) || currentTool === 'move') {
                commitPreview(x, y);
            }
            
            startX = -1;
            startY = -1;
            updateUI();
        }


        // --- Import/Export Logic ---

        function mergeVisibleLayers() {
            const composite = createBlankGrid(iconWidth, iconHeight);
            for (let y = 0; y < iconHeight; y++) {
                for (let x = 0; x < iconWidth; x++) {
                    for (const layer of layers) {
                        if (layer.visible && layer.data[y][x] === 1) {
                            composite[y][x] = 1;
                            break; 
                        }
                    }
                }
            }
            return composite;
        }

        /**
         * @brief Converts the 2D pixel grid into Row-Major format (Y, Bank, Bit)
         */
        function generateBitmapBytes(compositeGrid) {
            const h_banks = Math.ceil(iconWidth / 8); 
            const byte_array = [];

            // 1. Loop through Rows (Y-axis)
            for (let y = 0; y < iconHeight; y++) { 
                // 2. Loop through Horizontal Banks (8 pixels wide)
                for (let h_bank = 0; h_bank < h_banks; h_bank++) {
                    let current_byte = 0x00;
                    const start_x = h_bank * 8; 

                    // 3. Loop through 8 Bits/Columns (LSB first)
                    for (let bit_col = 0; bit_col < 8; bit_col++) {
                        const x_bit = start_x + bit_col;

                        if (x_bit < iconWidth) {
                            let is_set = compositeGrid[y][x_bit]; 
                            
                            if (is_set) {
                                current_byte |= (1 << bit_col); 
                            }
                        }
                    }
                    byte_array.push(current_byte);
                }
            }
            return byte_array;
        }

        function formatBytes(byte_array) {
            let output = `// Bitmap for ${iconWidth}x${iconHeight} icon. Total Bytes: ${byte_array.length}\n`;
            output += `const uint8_t ICON_BITMAP[${byte_array.length}] = {\n    `;
            for (let i = 0; i < byte_array.length; i++) {
                const hex = '0x' + byte_array[i].toString(16).toUpperCase().padStart(2, '0');
                output += hex;
                if (i < byte_array.length - 1) {
                    output += ', ';
                }
                if ((i + 1) % 8 === 0 && i < byte_array.length - 1) {
                    output += '\n    ';
                }
            }
            output += '\n};';
            return output;
        }
        
        function updateUI() {
            if (layers.length === 0) {
                 byteOutputDiv.textContent = "// No layers to export.";
                 byteCountSpan.textContent = 0;
                 dimsText.textContent = `${iconWidth}x${iconHeight}`;
                 drawScene();
                 return;
            }
            drawScene();
            const composite = mergeVisibleLayers();
            const bytes = generateBitmapBytes(composite);
            byteOutputDiv.textContent = formatBytes(bytes);
            dimsText.textContent = `${iconWidth}x${iconHeight}`;
            byteCountSpan.textContent = bytes.length;
        }
        
        /**
         * @brief Parses a C array string (e.g., 0x00, 0xFF) into a list of byte values.
         */
        function parseBytes(arrayString) {
            const regex = /0x[0-9a-fA-F]{1,2}|\d+/g;
            const matches = arrayString.match(regex);
            
            if (!matches) return [];

            return matches.map(m => {
                if (m.startsWith('0x')) {
                    return parseInt(m, 16);
                } else {
                    return parseInt(m, 10);
                }
            }).filter(n => !isNaN(n) && n >= 0 && n <= 255);
        }

        /**
         * @brief Converts the 1D byte array back to the 2D grid using Row-Major logic.
         */
        function parseCArray(byte_array, width, height) {
            const grid = createBlankGrid(width, height);
            const h_banks = Math.ceil(width / 8);
            
            if (byte_array.length !== h_banks * height) {
                console.error(`Mismatch: Expected ${h_banks * height} bytes, got ${byte_array.length}`);
                return null;
            }

            let byte_index = 0;
            for (let y = 0; y < height; y++) {
                for (let h_bank = 0; h_bank < h_banks; h_bank++) {
                    const bank_data = byte_array[byte_index++];
                    const start_x = h_bank * 8;

                    for (let bit_col = 0; bit_col < 8; bit_col++) {
                        const x = start_x + bit_col;
                        
                        if (x < width) {
                            // Check if the bit is set (LSB-first)
                            if (bank_data & (1 << bit_col)) {
                                grid[y][x] = 1;
                            }
                        }
                    }
                }
            }
            return grid;
        }

        /**
         * @brief Renders the parsed grid in the import modal preview canvas.
         */
        function drawPreview(grid, w, h) {
            const canvasW = previewCanvas.width;
            const canvasH = previewCanvas.height;
            const size = Math.min(canvasW / w, canvasH / h);

            previewCtx.clearRect(0, 0, canvasW, canvasH);
            previewCtx.fillStyle = '#10b981'; // Green for preview

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (grid[y][x] === 1) {
                        previewCtx.fillRect(x * size, y * size, size, size);
                    }
                }
            }
        }


        // --- Modal Control ---
        function showImportModal() {
            if (layers.length === 0) {
                // If no layer exists, create one before opening modal
                createNewLayer('Imported', true);
            }
            importModal.classList.remove('hidden');
            previewErrorP.classList.add('hidden');
            commitImportBtn.disabled = true;
            commitImportBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            previewDimsSpan.textContent = `W: ${iconWidth} H: ${iconHeight}`;
            previewBytesSpan.textContent = `Bytes: ${Math.ceil(iconWidth / 8) * iconHeight} (Expected)`;
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            arrayInput.focus();
            arrayInput.select();
        }
        
        function hideImportModal() {
            importModal.classList.add('hidden');
            arrayInput.value = '';
            parsedGrid = null;
        }
        
        function handlePreview() {
            const inputStr = arrayInput.value;
            const w = iconWidth;
            const h = iconHeight;
            const expectedBytes = Math.ceil(w / 8) * h;
            
            const bytes = parseBytes(inputStr);
            
            previewBytesSpan.textContent = `Bytes: ${bytes.length} (Expected: ${expectedBytes})`;

            if (bytes.length === 0) {
                previewErrorP.textContent = 'No valid hex/decimal bytes found.';
                previewErrorP.classList.remove('hidden');
                drawPreview(createBlankGrid(w, h), w, h);
                commitImportBtn.disabled = true;
                commitImportBtn.classList.add('opacity-50', 'cursor-not-allowed');
                parsedGrid = null;
                return;
            }

            if (bytes.length !== expectedBytes) {
                previewErrorP.textContent = `Byte count mismatch: Found ${bytes.length}, expected ${expectedBytes} for ${w}x${h}.`;
                previewErrorP.classList.remove('hidden');
                drawPreview(createBlankGrid(w, h), w, h);
                commitImportBtn.disabled = true;
                commitImportBtn.classList.add('opacity-50', 'cursor-not-allowed');
                parsedGrid = null;
                return;
            }
            
            parsedGrid = parseCArray(bytes, w, h);
            
            if (parsedGrid) {
                drawPreview(parsedGrid, w, h);
                previewErrorP.classList.add('hidden');
                commitImportBtn.disabled = false;
                commitImportBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                previewErrorP.textContent = 'Failed to generate grid from array.';
                previewErrorP.classList.remove('hidden');
                commitImportBtn.disabled = true;
                commitImportBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }
        
        function handleImport() {
            if (parsedGrid && layers.length > 0) {
                layers[activeLayerIndex].data = parsedGrid;
                updateUI();
                hideImportModal();
            }
        }

        // --- Initialization and Event Binding ---
        
        function initTools() {
            toolPanelDiv.innerHTML = '';
            TOOLS.forEach(tool => {
                const btn = document.createElement('button');
                btn.id = `tool-${tool.id}`;
                btn.className = `tool-btn p-3 rounded-xl transition duration-150 text-xl font-bold border border-gray-300 ${tool.id === currentTool ? 'active' : 'bg-gray-200 hover:bg-gray-300'}`;
                btn.innerHTML = tool.icon;
                btn.title = tool.name;
                btn.addEventListener('click', () => {
                    currentTool = tool.id;
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    canvas.style.cursor = tool.cursor;
                });
                toolPanelDiv.appendChild(btn);
            });
            canvas.style.cursor = TOOLS.find(t => t.id === currentTool).cursor;
        }

        function initEditor(width, height, retainLayers = false) {
            iconWidth = width;
            iconHeight = height;

            pixelSize = MAX_CANVAS_WIDTH / iconWidth; 
            
            canvas.width = MAX_CANVAS_WIDTH;
            canvas.height = MAX_CANVAS_WIDTH * (iconHeight / iconWidth); 

            if (!retainLayers || layers.length === 0) {
                layers = [];
                activeLayerIndex = 0;
                createNewLayer('Base Layer', true);
            } else {
                layers.forEach(layer => {
                    layer.data = createBlankGrid(iconWidth, iconHeight);
                });
            }

            renderLayerList();
            updateUI();
        }

        // Bind Drawing Events
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd); 

        // Bind Touch Events
        canvas.addEventListener('touchstart', handleStart);
        canvas.addEventListener('touchmove', handleMove);
        document.addEventListener('touchend', handleEnd);

        // Bind Controls
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (layers.length > 0) {
                layers[activeLayerIndex].data = createBlankGrid(iconWidth, iconHeight);
                updateUI();
            }
        });
        
        document.getElementById('applyResBtn').addEventListener('click', () => {
            const w = parseInt(inputWidth.value, 10);
            const h = parseInt(inputHeight.value, 10);
            
            if (isNaN(w) || w < 1 || w > 84 || isNaN(h) || h < 1 || h > 48) {
                console.error('Invalid dimensions');
                return;
            }
            initEditor(w, h, false); 
        });
        
        document.getElementById('newLayerBtn').addEventListener('click', () => {
            createNewLayer();
        });


        copyButton.addEventListener('click', () => {
            const bytesText = byteOutputDiv.textContent;
            if (!bytesText || bytesText.includes('No layers')) return;
            
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = bytesText;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                document.execCommand('copy');
                copyButton.textContent = 'C Array Copied!';
            } catch (err) {
                console.error('Copy failed:', err);
                copyButton.textContent = 'Copy Failed!';
            }
            document.body.removeChild(tempTextArea);

            setTimeout(() => {
                copyButton.textContent = 'Copy C Array to Clipboard';
            }, 2000);
        });

        // Modal Bindings
        mainImportBtn.addEventListener('click', showImportModal);
        cancelImportBtn.addEventListener('click', hideImportModal);
        previewArrayBtn.addEventListener('click', handlePreview);
        commitImportBtn.addEventListener('click', handleImport);


        // --- Initial Load ---
        window.onload = function() {
            initTools();
            initEditor(parseInt(inputWidth.value, 10), parseInt(inputHeight.value, 10), false); 
        };
    </script>
</body>
</html>
